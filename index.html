    <script>
      // Früher lief die Seite mit Hash-Routing (/#/impressum). Alte Links und Lesezeichen
      // auf die echten URLs umleiten: /#/ -> /, /#/impressum -> /impressum/, /#/#kontakt -> /#kontakt
      (function () {
        var hash = location.hash;
        if (hash.indexOf("#/") !== 0) return;
        var rest = hash.slice(1);
        var i = rest.indexOf("#");
        var path = i === -1 ? rest : rest.slice(0, i);
        var anchor = i === -1 ? "" : rest.slice(i);
        if (path.slice(-1) !== "/") path += "/";
        if (path === "/") history.replaceState(null, "", "/" + anchor);
        else location.replace(path + anchor);
      })();
    </script>
